name: Casa - build image

# Construye la imagen propia de Pato a partir de la rama "casa"
# y la publica en ghcr.io/patodorf1/split-pro:casa (la que usa Coolify).
on:
  push:
    branches: [casa]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=casa-${{ github.sha }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/patodorf1/split-pro:casa
            ghcr.io/patodorf1/split-pro:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
